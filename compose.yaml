services:
  database:
    image: mariadb:11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: pwd
      MYSQL_DATABASE: template_db
    ports:
      - "3376:3306"

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_ADDRESS=jdbc:mysql://database:3306
      - DB_DATABASE=template_db
      - DB_USER=root
      - DB_PASSWORD=pwd
    depends_on:
      - database

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_PROXY=http://backend:8080
    depends_on:
      - backend
  
  dataloader:
    build: ./dataloader
    environment:
      - DB_HOST=database
      - DB_NAME=template_db
      - DB_USER=root
      - DB_PASSWORD=pwd
      - BATCH_SIZE=1000
    depends_on:
      - database

