version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - DB_ADDRESS=jdbc:mysql://database:3306
      - DB_DATABASE=template_db
      - DB_USER=root
      - DB_PASSWORD=pwd
    depends_on:
      - database

  database:
    image: mariadb:11
    environment:
      - MYSQL_ROOT_PASSWORD=pwd
      - MYSQL_DATABASE=template_db
    ports:
      - "3306:3306"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_PROXY=http://backend:8080
    depends_on:
      - backend
